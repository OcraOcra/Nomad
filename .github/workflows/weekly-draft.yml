name: Weekly Draft

on:
  schedule:
    # Lunes 8:00 AM Costa Rica (UTC-6) = 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Install MCP server deps (if present)
        run: |
          for dir in mcp-servers/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing deps for $dir"
              (cd "$dir" && npm install --production)
            fi
            if [ -f "$dir/requirements.txt" ]; then
              echo "Installing Python deps for $dir"
              pip install -r "$dir/requirements.txt"
            fi
          done
        continue-on-error: true

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BCCR_EMAIL: ${{ secrets.BCCR_EMAIL }}
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m nomad weekly --force

      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: weekly-draft
          path: data/drafts/*.md
          retention-days: 30

      - name: Commit history
        run: |
          git config user.name "Nomad bot"
          git config user.email "bot@nomad.cr"
          git add data/drafts/ data/history/published.json data/raw/mcp/
          git diff --staged --quiet || (git commit -m "weekly: $(date +%Y-%m-%d)" && git push)
